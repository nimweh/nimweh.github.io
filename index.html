<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工具箱">
<meta name="theme-color" content="#F6F3EE">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>工具箱</title>
<style>
:root{--bg:#F6F3EE;--card:#fff;--ink:#2B2A27;--mut:#7C7669;--line:#E4DED3;--acc:#2F6B5E;--accw:#E7F0ED}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Hiragino Sans GB",sans-serif;display:flex;justify-content:center;min-height:100vh}
#wrap{width:100%;max-width:520px;padding:calc(22px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom));min-height:100vh}
h1{font-size:27px;font-weight:500;margin:0 0 8px;letter-spacing:.5px}
.sub{color:var(--mut);font-size:15px;margin:0 0 24px;line-height:1.7}
h2{font-size:19px;font-weight:500;margin:26px 0 10px}
p{margin:0 0 14px}
button.big{width:100%;border:0;border-radius:14px;background:var(--acc);color:#fff;font:inherit;font-size:17px;padding:16px;margin:6px 0 0}
button.ghost{width:100%;border:1px solid var(--line);border-radius:14px;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:14px;margin-top:10px}
.hint{font-size:13px;color:var(--mut);line-height:1.65;margin:8px 0 0}
details{border:1px solid var(--line);border-radius:14px;background:var(--card);margin:0 0 12px;overflow:hidden}
details summary{padding:15px 18px;font-size:16px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"＋";color:var(--mut);font-size:15px}
details[open] summary::after{content:"－"}
details[open] summary{border-bottom:1px solid var(--line)}
.md{padding:6px 18px 18px;font-size:15.5px;line-height:1.75}
.md h2{font-size:17px;margin:22px 0 8px;color:var(--acc)}
.md h3{font-size:15.5px;font-weight:500;margin:18px 0 6px}
.md ul,.md ol{padding-left:20px;margin:0 0 14px}
.md li{margin:0 0 7px}
.md blockquote{margin:0 0 14px;padding:2px 0 2px 12px;border-left:2px solid var(--acc);color:var(--mut)}
.md code{background:#F1EDE5;padding:1px 5px;border-radius:4px;font-size:14px}
.md pre{background:#F1EDE5;padding:12px;border-radius:10px;overflow:auto;font-size:13.5px;line-height:1.6}
.md pre code{background:none;padding:0}
.md table{width:100%;border-collapse:collapse;font-size:14px;margin:0 0 14px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.md th{background:#F1EDE5;font-weight:500}
.md hr{border:0;border-top:1px solid var(--line);margin:18px 0}
pre.raw{white-space:pre-wrap;word-break:break-word;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;font:400 14px/1.75 inherit;max-height:46vh;overflow:auto;margin:12px 0 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom));background:#2B2A27;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:80vw;text-align:center}
#toast.on{opacity:1}
a.card{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:16px;background:var(--card);padding:20px;margin:0 0 14px}
a.card b{display:block;font-size:20px;font-weight:500;margin-bottom:6px}
a.card span{display:block;font-size:15px;color:var(--mut);line-height:1.65}
a.card i{display:block;margin-top:12px;font-size:14px;color:var(--acc);font-style:normal}
.foot{margin-top:28px;font-size:13px;color:var(--mut);line-height:1.7;border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div id="wrap">
<h1>工具箱</h1>
<p class="sub">两个入口。都是离线可用，加到主屏就跟 App 一样。</p>
<a class="card" href="https://nimweh.github.io/release/"><b>释放</b><span>圣多纳释放法。放掉一件挂在心里的事，六分钟。点按式，有分支，按着走就行。</span><i>开始 →</i></a>
<a class="card" href="https://nimweh.github.io/pointing/"><b>指认</b><span>Fred Davis 的 The Living Method。不是放松，是看清「谁」在受苦。需要 AI 带着做，这里给 prompt 和弹药库。</span><i>开始 →</i></a>
<div class="foot">加到主屏：Safari 打开对应页面 → 分享 → 添加到主屏幕。iOS 的 Chrome 没有这个功能。<br><br>数据都存在本机浏览器里，不上传。</div></div>
<div id="toast"></div>
<script>
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.className='on';clearTimeout(window._tt);window._tt=setTimeout(function(){t.className=''},1800)}
function copyPrompt(){
  var el=document.getElementById('pdata');
  var t=el?el.textContent:'';
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){toast('已复制，去粘到 AI 里')},function(){fb(t)});
  }else{fb(t)}
}
function fb(t){
  var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('已复制，去粘到 AI 里')}catch(e){toast('长按下方原文手动复制')}
  document.body.removeChild(ta);
}
</script>
</body>
</html>
